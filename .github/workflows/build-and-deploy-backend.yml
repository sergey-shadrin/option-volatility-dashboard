name: Build and deploy backend
on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - 'app/backend/src/**'
      - 'app/backend/docker/**'
      - 'app/backend/docker-compose.yml'
      - 'app/backend/requirements.txt'
      - 'app/backend/build.env'
jobs:
  call-build-and-deploy:
    uses: ./.github/workflows/build-and-deploy-app.yml
    with:
      app: "backend"
    secrets: inherit